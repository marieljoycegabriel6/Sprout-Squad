<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>body{margin:0}[hidden]{display:none!important}</style></head><body>
<title>Sprout Squad Class</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sniglet:wght@400;800&family=Baloo+2:wght@500;600;700;800&display=swap">
<style>
/* Layout: sticky glass nav over a glowing night garden; pages are grids of glass cards; Garden = big stage + side toolkit */
:root{
  --night:#1b1442; --dusk:#2e2873; --lagoon:#17505c;
  --ink:#fff8ec; --muted:#cfc8f2; --faint:rgba(255,248,236,.62);
  --glow:#ffe98a; --mint:#8ff0c8; --pink:#ff9ec7; --coral:#ff8a7a; --sky:#8fd3ff;
  --glass:rgba(27,20,66,.55); --glass2:rgba(60,48,130,.6); --line:rgba(255,255,255,.18);
  --shadow:0 10px 30px rgba(8,4,30,.45);
  --display:"Sniglet","Baloo 2",ui-rounded,"Arial Rounded MT Bold",system-ui,sans-serif;
  --body:"Baloo 2",ui-rounded,system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
html,body{min-height:100%}
body{
  background:var(--night);
  color:var(--ink); font-family:var(--body); font-size:17px; line-height:1.35;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:#241b58}
#worldbox{position:fixed;inset:0;z-index:0;pointer-events:none}
#worldbox .world{position:absolute;inset:0;transition:opacity 2.2s ease}
.hills path{transition:fill 2.2s}
#sky{transition:opacity 2.2s;position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.hills{position:fixed;left:0;right:0;bottom:0;width:100%;height:32vh;min-height:170px;z-index:0;pointer-events:none}
.orb{position:fixed;z-index:0;border-radius:50%;pointer-events:none;transition:opacity 2.2s ease,transform 2.2s ease}
.orb.sun{width:130px;height:130px;right:16%;bottom:24vh;background:radial-gradient(circle at 40% 38%,#fffbe0,#ffd25a 60%,#ffb347);box-shadow:0 0 90px 40px rgba(255,190,110,.55),0 0 200px 90px rgba(255,150,170,.3);opacity:0;transform:translateY(160px)}
.orb.moon{width:64px;height:64px;right:9%;top:120px;background:radial-gradient(circle at 40% 40%,#fffbe8,#fff0c0);box-shadow:0 0 50px 18px rgba(255,240,200,.35)}
body[data-sky="day"] .orb.sun{opacity:1;transform:none}
body[data-sky="day"] .orb.moon{opacity:0;transform:translateY(-40px)}
.skybtn{display:flex;align-items:center;gap:8px;border:1px solid rgba(255,233,138,.55);background:rgba(27,20,66,.6);border-radius:999px;padding:6px 14px 6px 8px;font-weight:800;box-shadow:0 0 16px rgba(255,233,138,.25)}
.skybtn svg{width:28px;height:28px}
.gpage .app{padding-block-end:0}
.app{position:relative;z-index:1;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 140px;max-width:1500px;margin:0 auto}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--glow);outline-offset:2px}
svg{display:block}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;flex-wrap:wrap;align-items:center;gap:12px 18px;padding-block:12px;margin-bottom:18px}
.top::before{content:"";position:absolute;inset:0 calc(-1 * max(16px,env(safe-area-inset-left,0px)));background:rgba(27,20,66,.72);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line);z-index:-1}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.brand svg{width:44px;height:52px;filter:drop-shadow(0 0 10px rgba(143,240,200,.55))}
.brand h1{font-family:var(--display);font-weight:800;font-size:1.65rem;margin:0;letter-spacing:.3px;text-shadow:0 0 18px rgba(255,233,138,.45)}
.brand small{display:block;font-size:.8rem;color:var(--muted);font-weight:600;margin-top:-4px}
.clspick{display:flex;align-items:center;gap:8px}
.clspick select{background:var(--glass2);border:1px solid var(--line);border-radius:14px;padding:6px 12px;font-weight:700;font-size:1rem}
.clspick select option{background:#2a2266}
nav.tabs{display:flex;gap:6px;flex-wrap:wrap}
nav.tabs button{display:flex;align-items:center;gap:7px;border:1px solid transparent;background:transparent;border-radius:999px;padding:7px 14px;font-weight:700;color:var(--muted);font-size:1rem}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button:hover{background:var(--glass)}
nav.tabs button[aria-current="page"]{background:linear-gradient(180deg,rgba(255,233,138,.22),rgba(255,233,138,.08));border-color:rgba(255,233,138,.55);color:var(--ink);box-shadow:0 0 18px rgba(255,233,138,.25)}

/* shared */
.panel{backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);background:var(--glass);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);padding:18px}
.h2{font-family:var(--display);font-weight:800;font-size:1.5rem;margin:0;text-wrap:balance}
.sub{color:var(--faint);font-weight:600;font-size:.95rem}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--glass2);border-radius:14px;padding:7px 14px;font-weight:700}
.btn:hover{background:rgba(255,255,255,.2)}
.btn svg{width:20px;height:20px}
.btn.gold{background:linear-gradient(180deg,#ffe98a,#f7c64c);color:#3a2a10;border-color:#ffe98a;box-shadow:0 0 16px rgba(255,233,138,.45)}
.btn.mint{background:linear-gradient(180deg,#a9f7d6,#5fd6a6);color:#103a2c;border-color:#a9f7d6;box-shadow:0 0 14px rgba(143,240,200,.4)}
.btn.danger{border-color:rgba(255,138,122,.6);color:#ffd0c8}
.btn[disabled]{opacity:.4;cursor:not-allowed;box-shadow:none}
.round{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;border:none;padding:0;transition:transform .12s}
.round svg{width:24px;height:24px}
.round:active{transform:scale(.9)}
.round.plus{background:radial-gradient(circle at 35% 30%,#c6ffe6,#4fcf98);color:#0d3a28;box-shadow:0 0 14px rgba(143,240,200,.55)}
.round.minus{background:radial-gradient(circle at 35% 30%,#ffd2cb,#f2766a);color:#4a120c;box-shadow:0 0 12px rgba(255,138,122,.4)}
.round.sm{width:34px;height:34px}.round.sm svg{width:18px;height:18px}
.drop{display:inline-flex;align-items:center;gap:4px;font-weight:800;font-variant-numeric:tabular-nums}
.drop svg{width:20px;height:20px;filter:drop-shadow(0 0 5px rgba(127,216,255,.7))}
input[type=text],input[type=number],textarea,select.field{background:rgba(10,6,40,.35);border:1px solid var(--line);border-radius:12px;padding:6px 10px;min-width:0}
input[type=number]{width:84px;font-variant-numeric:tabular-nums}
textarea{width:100%;resize:vertical}
.empty{text-align:center;padding:40px 16px;color:var(--muted)}

/* class page */
.classhead{display:flex;flex-wrap:wrap;align-items:center;gap:12px 18px;margin-bottom:16px;background:rgba(27,20,66,.55);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:22px;padding:10px 16px}
.classhead .h2{font-size:2rem;margin-right:auto;text-shadow:0 0 16px rgba(143,240,200,.35)}
.allbox{display:flex;align-items:center;gap:8px;background:var(--glass);border:1px solid var(--line);border-radius:999px;padding:5px 6px 5px 14px;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.stu{position:relative;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);background:linear-gradient(180deg,rgba(50,40,115,.7),rgba(27,20,66,.6));border:1px solid var(--line);border-radius:22px;padding:10px 10px 12px;display:flex;flex-direction:column;align-items:center;gap:4px;transition:box-shadow .3s,transform .2s}
.stu:hover{box-shadow:0 0 22px rgba(143,240,200,.25)}
.stu .potw{width:86px;height:104px}
.stu .nm{font-family:var(--display);font-weight:800;font-size:1.2rem;text-align:center;line-height:1.1;overflow-wrap:anywhere}
.stu .pm{display:flex;gap:10px;margin-top:4px}
.stu.glowup{animation:glowup .7s}
.stu.shake{animation:shake .45s}
@keyframes glowup{0%{box-shadow:0 0 0 rgba(143,240,200,0)}40%{box-shadow:0 0 34px rgba(143,240,200,.85);transform:translateY(-4px)}100%{box-shadow:0 0 0 rgba(143,240,200,0)}}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-5px) rotate(-2deg)}75%{transform:translateX(5px) rotate(2deg)}}
.float{position:absolute;top:20px;left:50%;font-family:var(--display);font-weight:800;font-size:1.6rem;pointer-events:none;animation:floatup .9s forwards;transform:translateX(-50%)}
.float.up{color:var(--mint);text-shadow:0 0 12px rgba(143,240,200,.9)}
.float.down{color:var(--coral);text-shadow:0 0 12px rgba(255,138,122,.8)}
@keyframes floatup{to{opacity:0;transform:translate(-50%,-46px)}}
.teamsec{margin-top:26px}
.teamgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;margin-top:14px}
.team{border-radius:22px;border:1px solid var(--line);background:rgba(27,20,66,.7);overflow:hidden}
.team .th{display:flex;align-items:center;gap:8px;padding:10px 12px;background:linear-gradient(90deg,color-mix(in srgb,var(--tc) 55%,transparent),color-mix(in srgb,var(--tc) 15%,transparent))}
.team .th b{font-family:var(--display);font-size:1.25rem;margin-right:auto}
.team .mem{display:flex;flex-wrap:wrap;gap:6px;padding:12px}
.chip{border:1px solid var(--line);background:rgba(255,255,255,.1);border-radius:999px;padding:3px 11px;font-weight:700;font-size:.95rem}
.chip:hover{background:rgba(255,255,255,.2)}
.stepper{display:flex;align-items:center;gap:6px;background:var(--glass);border:1px solid var(--line);border-radius:999px;padding:4px}
.stepper span{min-width:28px;text-align:center;font-weight:800;font-variant-numeric:tabular-nums}

/* garden */
.gardenwrap{display:grid;grid-template-columns:minmax(0,1fr) 128px;gap:16px;align-items:start}
.stage{position:relative;min-height:max(520px,calc(100vh - 110px));min-height:max(520px,calc(100dvh - 110px))}
.stage .bd{position:absolute;inset:0;width:100%;height:100%}
.stage .bd{position:absolute;inset:0;width:100%;height:100%}
.stage .tool{position:relative;z-index:1;padding:18px;display:flex;flex-direction:column;align-items:center;gap:14px}
.toolcard{width:min(100%,780px);display:flex;flex-direction:column;align-items:center;gap:14px;padding:18px;border-radius:26px;background:rgba(27,20,66,.6);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);box-shadow:var(--shadow)}
.toolcard.slim{width:auto;padding:8px 18px;gap:2px;border-radius:999px}
.stage .tool{pointer-events:none}
.stage .tool>*{pointer-events:auto}
.roam{position:absolute;inset:0;z-index:0;transition:opacity .4s}
.roam.dim{opacity:.5}
.roam.dim .rm{pointer-events:none}
.rm{position:absolute;width:74px;transform:translate(-50%,-100%) scale(var(--sc,1));transform-origin:50% 100%;display:flex;flex-direction:column;align-items:center;cursor:pointer;border:none;background:none;padding:0}
.rm .rmpot{width:62px;height:75px;transition:transform .2s}
.rm .rmpot svg{width:100%;height:100%}
.rm.l .rmpot{transform:scaleX(-1)}
.rm.walk .rmpot{animation:hop .42s infinite alternate ease-in-out}
.rm.l.walk .rmpot{animation-name:hopl}
@keyframes hop{from{transform:translateY(0) rotate(-3deg)}to{transform:translateY(-6px) rotate(3deg)}}
@keyframes hopl{from{transform:scaleX(-1) translateY(0) rotate(-3deg)}to{transform:scaleX(-1) translateY(-6px) rotate(3deg)}}
.rm .feet{display:flex;gap:12px;margin-top:-5px}
.rm .feet i{width:12px;height:7px;border-radius:50%;background:#4b3a8a;display:block}
.rm.walk .feet i{animation:step .42s infinite alternate}
.rm.walk .feet i+i{animation-direction:alternate-reverse}
@keyframes step{from{transform:translateY(0)}to{transform:translateY(-4px)}}
.rm .tag{margin-top:3px;font-family:var(--display);font-weight:800;font-size:.95rem;line-height:1;padding:3px 8px;border-radius:999px;background:rgba(20,12,60,.65);border:1px solid var(--line);white-space:nowrap;color:var(--ink)}
.rm::before{content:"";position:absolute;bottom:14px;left:50%;width:56px;height:12px;transform:translateX(-50%);border-radius:50%;background:rgba(8,4,30,.35);z-index:-1}
.rm.sel .rmpot,.rm.lucky .rmpot{filter:drop-shadow(0 0 14px #ffe98a) drop-shadow(0 0 4px #ffe98a)}
.rm.sel .tag,.rm.lucky .tag{background:#ffe98a;color:#3a2a10}
.rm .bub{position:absolute;bottom:calc(100% + 4px);left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:999px;background:rgba(27,20,66,.9);border:1px solid rgba(255,233,138,.6);box-shadow:0 0 18px rgba(255,233,138,.35);white-space:nowrap;cursor:default}
.rm .float{top:-10px}
.bf{animation:bfly 22s linear infinite}
.bf .wing{transform-box:fill-box;transform-origin:center;animation:flap .22s ease-in-out infinite alternate}
@keyframes flap{from{transform:scaleX(1)}to{transform:scaleX(.25)}}
@keyframes bfly{0%{transform:translate(80px,230px)}20%{transform:translate(300px,150px)}40%{transform:translate(520px,250px)}60%{transform:translate(760px,170px)}80%{transform:translate(940px,240px)}100%{transform:translate(80px,230px)}}
.tw{animation:tw 1.8s ease-in-out infinite alternate}
@keyframes tw{from{opacity:.35}to{opacity:1}}
.glevel{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 8px;border-radius:20px;border:1px solid rgba(255,233,138,.4);background:rgba(27,20,66,.7);text-align:center}
.glevel b{font-family:var(--display);font-size:.95rem;line-height:1.1;color:var(--glow)}
.glevel .ring{width:56px;height:56px}
.glevel small{font-size:.78rem;color:var(--muted);font-weight:700;line-height:1.15}
.celebrate{position:absolute;inset:0;z-index:5;pointer-events:none;display:grid;place-items:center}
.celebrate .ban{font-family:var(--display);font-weight:800;font-size:clamp(2rem,6vw,3.6rem);color:#3a2a10;background:linear-gradient(180deg,#fff3b0,#ffd25a);padding:14px 34px;border-radius:999px;box-shadow:0 0 50px rgba(255,233,138,.8);text-align:center;animation:ban 3.4s forwards}
.celebrate .ban small{display:block;font-size:.45em;color:#6a4a10}
@keyframes ban{0%{transform:scale(.3);opacity:0}12%{transform:scale(1.08);opacity:1}20%{transform:scale(1)}85%{opacity:1}100%{opacity:0;transform:translateY(-30px)}}
.spark{position:absolute;width:12px;height:12px;border-radius:50%;background:#ffe98a;box-shadow:0 0 14px #ffe98a;animation:spark 1.4s ease-out forwards}
@keyframes spark{from{transform:translate(0,0) scale(1);opacity:1}to{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}
.crownbtn{position:absolute;top:8px;right:8px;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:rgba(27,20,66,.6);padding:5px;opacity:.5;z-index:2}
.crownbtn:hover{opacity:.85}
.crownbtn.on{opacity:1;border-color:#ffe98a;box-shadow:0 0 14px rgba(255,233,138,.6);background:rgba(255,233,138,.22)}
.crownbtn svg{width:100%;height:100%}
.stu.king{border-color:rgba(255,233,138,.85);box-shadow:0 0 26px rgba(255,233,138,.4)}
.potbtn{cursor:pointer;border:none;background:none;padding:0;border-radius:18px}
.sotd{display:flex;align-items:center;gap:8px;padding:4px 16px 4px 6px;border-radius:999px;background:linear-gradient(90deg,rgba(255,233,138,.32),rgba(255,233,138,.08));border:1px solid rgba(255,233,138,.6);font-weight:800;box-shadow:0 0 18px rgba(255,233,138,.25)}
.sotd .potw{width:38px;height:46px}
.ofgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px}
.of{display:flex;flex-direction:column;align-items:center;gap:5px;padding:8px;border-radius:16px;border:1px solid var(--line);background:rgba(255,255,255,.06);font-weight:700;font-size:.9rem;text-align:center}
.of .potw{width:62px;height:74px}
.of.on{border-color:#8ff0c8;box-shadow:0 0 14px rgba(143,240,200,.4)}
.ofprev{width:72px;height:86px;filter:drop-shadow(0 0 12px rgba(255,233,138,.35))}
.rm .dz{position:absolute;top:-4px;left:50%;width:58px;height:22px;margin-left:-29px;animation:dz 1.1s linear infinite;z-index:3}
@keyframes dz{to{transform:rotate(360deg)}}
.rm.dizzy .rmpot{animation:wob .7s ease-in-out infinite alternate}
.rm.l.dizzy .rmpot{animation:wobl .7s ease-in-out infinite alternate}
@keyframes wob{from{transform:rotate(-14deg)}to{transform:rotate(14deg)}}
@keyframes wobl{from{transform:scaleX(-1) rotate(-14deg)}to{transform:scaleX(-1) rotate(14deg)}}
.rm.dizzy .tag{background:rgba(155,108,255,.8)}
.rm.atk .rmpot{animation:atk .35s ease-out}
@keyframes atk{40%{transform:translateY(-16px) scale(1.12)}}
.mon{position:absolute;width:210px;transform:translate(-50%,-100%);z-index:2000;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;border:none;background:none;padding:0}
.mon .mbody{width:100%;animation:mbob 2.4s ease-in-out infinite alternate}
.mon svg{width:100%;display:block;filter:drop-shadow(0 0 18px var(--mc))}
@keyframes mbob{from{transform:translateY(0)}to{transform:translateY(-10px)}}
.mon.hit .mbody{animation:mhit .35s}
@keyframes mhit{25%{transform:translateX(-12px) rotate(-6deg);filter:brightness(1.8)}75%{transform:translateX(9px) rotate(4deg)}}
.mon.lunge .mbody{animation:lunge .5s}
@keyframes lunge{40%{transform:translateX(-46px) scale(1.14)}}
.mon.poof{animation:poof .8s forwards}
@keyframes poof{to{transform:translate(-50%,-100%) scale(1.6);opacity:0;filter:blur(6px)}}
.mon .float{top:30px}
.hpbar{width:160px;height:14px;border-radius:999px;background:rgba(10,6,40,.75);border:1px solid rgba(255,255,255,.45);overflow:hidden}
.hpbar i{display:block;height:100%;background:linear-gradient(90deg,#ff8a7a,#ffe98a);transition:width .3s;box-shadow:0 0 10px #ff8a7a}
.mtag{font-family:var(--display);font-weight:800;padding:2px 12px;border-radius:999px;background:rgba(20,12,60,.8);border:1px solid var(--line);white-space:nowrap;color:var(--ink)}
.roam.dim .mon{pointer-events:none}
.proj{position:fixed;left:-17px;top:-17px;width:34px;height:34px;z-index:45;pointer-events:none}
.proj svg{width:100%;height:100%}
.qtext{font-family:var(--display);font-weight:800;font-size:clamp(1.6rem,4vw,2.6rem);text-align:center;line-height:1.2;text-shadow:0 0 18px rgba(255,233,138,.35);overflow-wrap:anywhere;max-width:100%}
.qans{color:var(--mint);font-weight:800;font-size:1.3rem;text-align:center}
.answerer{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;font-size:1.7rem;min-height:72px}
.answerer .potw{width:58px;height:70px}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px;margin-top:12px}
.badge{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;padding:10px;border-radius:18px;background:rgba(255,233,138,.08);border:1px solid rgba(255,233,138,.3)}
.badge svg{width:84px;height:96px;filter:drop-shadow(0 0 12px rgba(255,233,138,.4))}
.badge b{font-family:var(--display);font-size:1.1rem}
.badge small{color:var(--muted);font-weight:700}
#festbox{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.fgar{position:absolute;left:0;top:calc(var(--hh,76px) + env(safe-area-inset-top,0px));filter:drop-shadow(0 4px 10px rgba(8,4,30,.35))}
.fg{position:absolute;bottom:0;width:clamp(150px,20vw,280px)}
.fg.fl{left:0}.fg.fr{right:0}
body[data-fest="dragon"] .fg{bottom:34px}
.fg svg,.flt svg,.fmoon svg{width:100%;height:auto;display:block}
.bat{position:absolute;left:0;width:56px;filter:drop-shadow(0 0 6px rgba(255,170,80,.6));animation:batfly linear infinite}
@keyframes batfly{0%{transform:translate(-90px,0)}25%{transform:translate(25vw,40px)}50%{transform:translate(50vw,-10px)}75%{transform:translate(75vw,30px)}100%{transform:translate(calc(100vw + 90px),0)}}
.bat .wl{transform-box:fill-box;transform-origin:right center;animation:flapw .22s infinite alternate}
.bat .wr{transform-box:fill-box;transform-origin:left center;animation:flapw .22s infinite alternate}
@keyframes flapw{to{transform:scaleY(.35)}}
.balloon{position:absolute;bottom:-130px;width:44px;animation:rise linear infinite}
@keyframes rise{0%{transform:translateY(0) rotate(-5deg)}50%{transform:translateY(-55vh) rotate(5deg)}100%{transform:translateY(calc(-100vh - 170px)) rotate(-5deg)}}
.water{position:absolute;left:0;bottom:0;height:52px;width:100%}
.boat{position:absolute;left:0;bottom:8px;width:230px;animation:sail linear infinite}

.boat svg,.bob{animation:fbob 1.8s ease-in-out infinite alternate}

.fmoon{position:absolute;right:max(16px,calc(12% + 60px));top:calc(var(--hh,76px) + 30px);width:170px;transition:opacity 2s}

body[data-fest="moon"] .orb.moon{opacity:0}
.mfh{margin:4px 0 0;font-family:var(--display);font-size:1.15rem;color:var(--glow)}

.trk{display:flex;align-items:center;gap:10px;text-align:left;padding:10px 12px;border-radius:16px;border:1px solid var(--line);background:rgba(255,255,255,.06)}
.trk b{display:block;font-family:var(--display);font-size:1.05rem;line-height:1.15}
.trk small{color:var(--muted);font-weight:700}
.trk.on,.fst.on{border-color:#ffe98a;background:rgba(255,233,138,.16);box-shadow:0 0 16px rgba(255,233,138,.3)}
.trk:hover,.fst:hover{background:rgba(255,255,255,.12)}
.eqi{width:30px;height:30px;flex:none}
.eqi rect{fill:#cfc8f2;opacity:.55}
.eqi.play rect{fill:#8ff0c8;opacity:1}
.eqi.play rect{animation:eq .9s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:bottom}
.eqi.play rect:nth-child(2){animation-delay:-.3s}.eqi.play rect:nth-child(3){animation-delay:-.6s}

.fstgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:10px}
.fst{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 6px;border-radius:16px;border:1px solid var(--line);background:rgba(255,255,255,.06);font-size:.92rem;font-weight:700;text-align:center;line-height:1.15}
.fst svg{width:56px;height:56px}
.kit{display:flex;flex-direction:column;gap:10px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 92px)}
.kit button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 6px;border-radius:20px;border:1px solid var(--line);background:rgba(27,20,66,.65);backdrop-filter:blur(8px);font-weight:800;color:var(--muted)}
.kit button svg{width:34px;height:34px}
.kit button:hover{background:var(--glass2)}
.kit button[aria-pressed="true"]{color:var(--ink);background:linear-gradient(180deg,rgba(255,233,138,.25),rgba(255,233,138,.06));border-color:rgba(255,233,138,.6);box-shadow:0 0 20px rgba(255,233,138,.3)}
.kitlabel{font-family:var(--display);font-weight:800;text-align:center;color:var(--glow);font-size:1rem}
.bigtime{font-family:var(--display);font-weight:800;font-size:clamp(3.6rem,10vw,7rem);line-height:1;font-variant-numeric:tabular-nums;text-shadow:0 0 30px rgba(255,233,138,.55)}
.sunarc{width:min(100%,560px)}
.toolbar{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
.toolbar .btn{font-size:1.05rem}
.pill{border-radius:999px}
.vbar{position:relative;width:min(100%,520px);height:20px;border-radius:999px;background:rgba(255,255,255,.1);border:1px solid var(--line);overflow:hidden}
#vfill{position:absolute;inset:0;background:linear-gradient(90deg,#8ff0c8 0%,#ffe98a 55%,#ff8a7a 100%);clip-path:inset(0 100% 0 0)}
.vbar i{position:absolute;top:0;bottom:0;width:3px;margin-left:-1.5px;background:#fff;opacity:.85}
input[type=range]{accent-color:#ffe98a;width:160px}
.meter{display:flex;gap:8px;width:min(100%,520px)}
.meter i{flex:1;height:22px;border-radius:999px;background:rgba(255,255,255,.1);border:1px solid var(--line);transition:background .3s,box-shadow .3s}
.noisebtns{display:flex;flex-wrap:wrap;justify-content:center;gap:10px}
.noisebtns .btn{font-size:1.15rem;padding:10px 18px}
.beetle{width:min(100%,420px)}
.picked{display:flex;flex-direction:column;align-items:center;gap:6px;min-height:290px;justify-content:center}
.picked .potw{width:170px;height:206px;filter:drop-shadow(0 0 24px rgba(255,233,138,.35))}
.picked .pname{font-family:var(--display);font-weight:800;font-size:clamp(2.4rem,7vw,4.4rem);text-shadow:0 0 22px rgba(255,233,138,.6);text-align:center}
.picked.pop .potw{animation:pop .5s}

.race{width:100%;display:flex;flex-direction:column;gap:14px}
.lane{display:grid;grid-template-columns:170px minmax(0,1fr);gap:12px;align-items:center}

.track{position:relative;height:84px;border-radius:999px;background:rgba(10,6,40,.45);border:2px dashed color-mix(in srgb,var(--tc) 60%,transparent)}
.track .base{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:62px;height:62px}

.who-pick{display:flex;align-items:center;gap:10px;background:var(--glass);border:1px solid var(--line);border-radius:999px;padding:5px 14px 5px 6px}

.log{margin-top:22px}

.list{display:flex;flex-direction:column;gap:8px}
.lrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}

.mini{font-size:.85rem;color:var(--faint)}

.modal{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:rgba(8,4,30,.6);backdrop-filter:blur(4px);padding:16px}
.modal .box{background:linear-gradient(180deg,#3a2f86,#261d5e);border:1px solid var(--line);border-radius:24px;padding:22px;max-width:420px;width:100%;box-shadow:var(--shadow),0 0 40px rgba(255,233,138,.15);display:flex;flex-direction:column;gap:16px}
.modal p{margin:0;font-size:1.15rem;font-weight:700}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(120px);z-index:60;background:#3a2f86;border:1px solid rgba(255,233,138,.5);border-radius:999px;padding:9px 20px;font-weight:700;box-shadow:0 0 22px rgba(255,233,138,.3);transition:transform .3s}
.toast.show{transform:translateX(-50%) translateY(0)}

@media (max-width:760px){
  .mon{width:150px}
  .gardenwrap{grid-template-columns:1fr}
  .kit{position:static;flex-direction:row;overflow-x:auto}

  .lane{grid-template-columns:1fr}
  .grid{grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}
  .brand h1{font-size:1.35rem}
  .stage{min-height:max(520px,calc(100dvh - 190px))}

  c.teams=makeTeamList(c,4);c.teams.forEach((t,i)=>t.pts=[6,4,9,3][i]);

function makeTeamList(c,n,old){
  old=old||[];const sh=shuffle(c.students.map(s=>s.id));

  sh.forEach((id,i)=>teams[i%n].members.push(id));return teams;
}

  o.opt=Object.assign({sound:true,goal:20,sort:"az",nzT:70,gfull:40,sunrise:true,sky:"night",mhp:20,qpt:true,nzL:55,vol:35,track:"lullaby",fest:"none",festHats:true},o.opt||{});

async function initCloud(){
  try{
    if(!window.claude||!window.claude.use)return;
    const [db,user]=await Promise.all([window.claude.use("db"),window.claude.use("user")]);
    if(!db||!user)return;
    const id=await user.id();if(!id)return;
    dbDoc=db.doc("data/users/"+id+"/state");
    const snap=await dbDoc.get();
    if(snap.exists){const d=snap.data();if(d&&d.json){const o=JSON.parse(d.json);if(o&&o.classes){S=fix(o);try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}render()}}}
    else{await dbDoc.set({json:JSON.stringify(S),t:Date.now()})}

  }catch(e){}
}

  return`<div class="toolcard ${tool==="roam"?"slim":""}">${b}</div>`;
}
function kitHTML(){
  const tools=[["roam","Garden",I.garden],["quiz","Questions",I.quiz],["battle","Battle",I.monster],["timer","Timer",I.timer],["noise","Noise",I.noise],["pick","Picker",I.dice],["team","Teams",I.team]];
  return tools.map(([k,l,ic])=>`<button data-act="tool" data-t="${k}" aria-pressed="${tool===k}">${ic}${l}</button>`).join("");
}
function gardenPage(){
  const tools=[["roam","Garden",I.garden],["timer","Timer",I.timer],["noise","Noise",I.noise],["pick","Picker",I.dice],["team","Teams",I.team]];
  const body=toolBody();
  return`<div class="gardenwrap"><div class="stage" id="stage"><div class="roam ${interTool()?"":"dim"}" id="roam">${roamers()}</div><div class="tool">${body}</div></div><aside class="kit" id="kit" aria-label="Tool kit">${kitHTML()}</aside></div>`;
}
function afterGarden(){rEls=[...document.querySelectorAll(".rm")];if(tool==="timer")updTimer()}

/* shop */
let shopper=null;
function shopPage(){
  const c=cls();if(!c.students.find(s=>s.id===shopper))shopper=c.students[0]?.id||null;
  const s=shopper&&stu(c,shopper);
  let h=`<div class="shophead"><h2 class="h2">Seed Shop</h2>${s?`<div class="who-pick">${sproutOf(s)}<select class="field" id="shopSel" aria-label="Who is shopping">${c.students.slice().sort((a,b)=>a.name.localeCompare(b.name)).map(x=>`<option value="${x.id}" ${x.id===shopper?"selected":""}>${esc(x.name)}</option>`).join("")}</select><span class="drop" style="font-size:1.3rem">${I.drop}${s.pts}</span></div>`:""}<button class="btn" data-act="nav" data-p="setup">${I.gear}Edit items</button></div>`;
  if(!S.shop.length)h+=`<div class="panel empty">No items yet. Add your rewards in Settings.</div>`;
  else h+=`<div class="items">${S.shop.map(it=>`<div class="item"><svg class="ic" viewBox="0 0 64 64" aria-hidden="true">${(REWARD_ICONS[it.icon]||REWARD_ICONS.star).replace(/^<svg[^>]*>|<\/svg>$/g,"")}</svg><b>${esc(it.name)}</b><span class="drop">${I.drop}${it.cost}</span><button class="btn gold" data-act="buy" data-iid="${it.id}" ${s&&s.pts>=it.cost?"":"disabled"}>Buy</button></div>`).join("")}</div>`;
  if(s)h+=`<div class="log panel"><h3 class="h2" style="font-size:1.3rem">Sprout outfits</h3><div class="items" style="margin-top:12px">${OUTFITS.map(o=>{const own=s.owned.includes(o.id),on=s.wear[o.slot]===o.id,cost=S.ocost[o.id];return`<div class="item">${potSVG(s.color,stageOf(s.grow),"ofprev",{wear:{[o.slot]:o.id}})}<b>${esc(o.name)}</b>${own?`<span class="sub">Owned</span><button class="btn ${on?"mint":""}" data-act="wear" data-sid="${s.id}" data-o="${o.id}">${on?"Wearing":"Wear"}</button>`:`<span class="drop">${I.drop}${cost}</span><button class="btn gold" data-act="buyof" data-o="${o.id}" ${s.pts>=cost?"":"disabled"}>Buy</button>`}</div>`}).join("")}</div></div>`;
  if(c.log.length)h+=`<div class="log panel"><h3 class="h2" style="font-size:1.2rem">Recent</h3><ul>${c.log.slice(0,8).map(l=>`<li><b>${esc(l.who)}</b> bought <b>${esc(l.item)}</b><span class="drop">${I.drop}${l.cost}</span><span class="mini">${esc(l.when)}</span></li>`).join("")}</ul></div>`;
  return h;
}

    <label class="mini" for="newStu">Add students (one name per line)</label><textarea id="newStu" rows="3" placeholder="Amy&#10;Ben&#10;Chloe"></textarea><div class="row"><button class="btn mint" data-act="addstu">${I.plus}Add students</button></div></section>

   <section class="panel"><h3 class="h2" style="font-size:1.25rem">Growing</h3><p class="mini" style="margin:0">Points earned to reach each stage. Spending in the shop does not shrink the plant.</p><div class="stages">${S.stages.map((v,i)=>`<label>${potSVG("#6cc3f0",i)}${STAGE_NAMES[i]}<input type="number" id="st-${i}" data-f="stage" data-i="${i}" min="0" value="${v}" ${i===0?"disabled":""}></label>`).join("")}</div></section>

   <section class="panel"><h3 class="h2" style="font-size:1.25rem">Shop items</h3><div class="list">${S.shop.map(it=>`<div class="lrow" style="border-bottom:1px solid var(--line);padding-bottom:8px"><input type="text" id="in-${it.id}" data-f="iname" data-id="${it.id}" value="${esc(it.name)}" aria-label="Item name"><span class="drop">${I.drop}</span><input type="number" id="ic-${it.id}" data-f="icost" data-id="${it.id}" min="0" value="${it.cost}" aria-label="Cost"><button class="btn danger" data-act="delitem" data-id="${it.id}" aria-label="Delete item">${I.trash}</button><div class="iconpick">${Object.keys(REWARD_ICONS).map(k=>`<button data-act="iicon" data-id="${it.id}" data-k="${k}" aria-pressed="${it.icon===k}" aria-label="${k}">${REWARD_ICONS[k]}</button>`).join("")}</div></div>`).join("")}</div><div class="row"><button class="btn mint" data-act="additem">${I.plus}Add item</button></div></section>

   <section class="panel" style="grid-column:1/-1"><h3 class="h2" style="font-size:1.25rem">Music and festivals</h3><div id="mfSet" style="display:flex;flex-direction:column;gap:12px">${mfHTML(false)}</div></section>

   <section class="panel"><h3 class="h2" style="font-size:1.25rem">Questions</h3><p class="mini" style="margin:0">These show in the Garden under Questions. The answer is optional.</p><div class="list">${S.questions.map((q,i)=>`<div class="lrow" style="border-bottom:1px solid var(--line);padding-bottom:8px"><span class="mini" style="width:22px">${i+1}</span><input type="text" id="qq-${q.id}" data-f="qq" data-id="${q.id}" value="${esc(q.q)}" placeholder="Question" aria-label="Question ${i+1}"><input type="text" id="qa-${q.id}" data-f="qa" data-id="${q.id}" value="${esc(q.a||"")}" placeholder="Answer (optional)" aria-label="Answer ${i+1}"><button class="btn danger" data-act="delq" data-id="${q.id}" aria-label="Delete question">${I.trash}</button></div>`).join("")||'<p class="sub">No questions yet.</p>'}</div>

    <h4 style="margin:6px 0 0">Outfit prices</h4><div class="list">${OUTFITS.map(o=>`<div class="lrow"><span style="flex:1;font-weight:700">${esc(o.name)}</span><span class="drop">${I.drop}</span><input type="number" id="oc-${o.id}" data-f="ocost" data-id="${o.id}" min="0" value="${S.ocost[o.id]}" aria-label="${esc(o.name)} price"></div>`).join("")}</div></section>

    <textarea id="backup" rows="3" readonly>${esc(JSON.stringify(S))}</textarea>
    <div class="row"><button class="btn" data-act="copy">${I.copy}Copy backup</button></div>

/* ---------- actions ---------- */
function bump(sid,d){
  const c=cls(),s=stu(c,sid);if(!s)return;
  s.pts+=d;s.grow=Math.max(0,s.grow+d);save();
  d>0?sfx.up():sfx.down();
  render();checkGarden();
  document.querySelectorAll(`.stu[data-sid="${sid}"],.rm[data-rid="${sid}"]`).forEach(el=>{el.classList.add(d>0?"glowup":"shake");const f=document.createElement("span");f.className="float "+(d>0?"up":"down");f.textContent=d>0?"+1":"-1";el.appendChild(f)});
}
document.addEventListener("click",e=>{
  if(e.target.id==="spanel"){$("#spanel").hidden=true;spOpen=null;return}
  if(e.target.id==="mfpanel"){$("#mfpanel").hidden=true;return}
  const b=e.target.closest("[data-act]");
  if(rSel&&page==="garden"&&!e.target.closest(".rm")){rSel=null;if(!b){render();return}}
  if(!b)return;const a=b.dataset.act,c=cls();
  switch(a){
  case"mfopen":$("#mfpanel").hidden=false;refreshMF();break;
  case"mfclose":$("#mfpanel").hidden=true;break;
  case"bgm":{const id=b.dataset.id;T.byTimer=false;if(BGM.on&&BGM.id===id&&b.classList.contains("trk"))bgmStop();else bgmPlay(id);refreshMF();break}
  case"bgmstop":T.byTimer=false;bgmStop();refreshMF();break;
  case"fest":{S.opt.fest=b.dataset.id;save();applyFest();const fd=FESTS.find(f=>f.id===S.opt.fest);if(BGM.on&&fd&&fd.track&&BGM.id!==fd.track)bgmPlay(fd.track);if(S.opt.fest!=="none"){sfx.chime();toast(fd.greet)}render();refreshMF();break}
  case"festhats":S.opt.festHats=!S.opt.festHats;save();applyFest();render();refreshMF();break;
  case"rsel":{if(e.target.closest(".bub"))break;const sid=b.dataset.rid;
    if(battleOn()&&interTool()){attack(sid);break}
    if(tool!=="roam")break;rSel=rSel===sid?null:sid;sfx.tick();render();break}
  case"monhit":{const t=c.ans&&stu(c,c.ans);if(t)monsterAttack(t.id);else toast("Pick who answers in Questions first");break}
  case"swarm":swarm(b.dataset.tid);break;
  case"mnew":{const v=$("#mhp");newMonster(v?v.value:S.opt.mhp);break}
  case"mnew2":{const B=c.battle;ask(`Send ${B?B.name:"the monster"} away and bring a new one?`,"New monster",()=>{c.battle=null;save();render();const v=$("#mhp");if(v)v.focus()});break}
  case"mhide":if(c.battle){c.battle.on=false;save();render()}break;
  case"mshow":if(c.battle){c.battle.on=true;save();sfx.roar();render()}break;
  case"wake":c.students.forEach(s=>s.dizzy=null);save();render();toast("Everyone is awake!");break;
  case"qpick":qPick();break;
  case"qnext":if(S.questions.length)newRound((c.qi+1)%S.questions.length);break;
  case"qprev":if(S.questions.length){c.qi=(c.qi-1+S.questions.length)%S.questions.length;c.ans=null;quiz.marked=false;showAns=false;save();render()}break;
  case"qrand":{const n=S.questions.length;if(!n)break;let i=Math.floor(Math.random()*n);if(n>1)while(i===c.qi)i=Math.floor(Math.random()*n);newRound(i);break}
  case"qshow":showAns=!showAns;render();break;
  case"qright":{const sid=c.ans;if(!sid)break;quiz.marked=true;if(S.opt.qpt)bump(sid,1);else{sfx.up();render()}if(battleOn())setTimeout(()=>attack(sid),120);break}
  case"qwrong":{const sid=c.ans,k=stu(c,sid);if(!k)break;quiz.marked=true;render();if(battleOn())setTimeout(()=>monsterAttack(sid),80);else toast("Good try, "+k.name+"!");break}
  case"sotd":{const sid=b.dataset.sid,k=stu(c,sid);if(!k)break;c.sotd=c.sotd===sid?null:sid;save();if(c.sotd){sfx.pop();toast(k.name+" is student of the day!")}render();break}
  case"openstu":spOpen=b.dataset.sid;$("#spanel").hidden=false;refreshPanel();break;
  case"spclose":$("#spanel").hidden=true;spOpen=null;break;
  case"wear":{const k=stu(c,b.dataset.sid),o=OUTFITS.find(x=>x.id===b.dataset.o);if(!k||!o)break;k.wear[o.slot]=k.wear[o.slot]===o.id?null:o.id;save();sfx.tick();render();break}
  case"give":{const k=stu(c,b.dataset.sid),o=OUTFITS.find(x=>x.id===b.dataset.o);if(!k||!o)break;if(!k.owned.includes(o.id))k.owned.push(o.id);k.wear[o.slot]=o.id;save();sfx.buy();render();toast(k.name+" got the "+o.name);break}
  case"buyof":{const k=stu(c,shopper),o=OUTFITS.find(x=>x.id===b.dataset.o);if(!k||!o)break;const cost=S.ocost[o.id];ask(`${k.name} buys the ${o.name} for ${cost} points?`,"Buy",()=>{k.pts-=cost;if(!k.owned.includes(o.id))k.owned.push(o.id);k.wear[o.slot]=o.id;const d=new Date();c.log.unshift({who:k.name,item:o.name,cost,when:d.toLocaleDateString(undefined,{month:"short",day:"numeric"})+" "+d.toLocaleTimeString(undefined,{hour:"2-digit",minute:"2-digit"})});c.log=c.log.slice(0,30);save();sfx.buy();render();toast(k.name+" got the "+o.name)});break}
  case"addq":{const lines=$("#newQ").value.split("\n").map(x=>x.trim()).filter(Boolean);if(!lines.length){toast("Type a question first");break}lines.forEach(l=>{const [q,...a]=l.split("|");S.questions.push({id:uid(),q:q.trim(),a:a.join("|").trim()})});save();render();toast(lines.length+" added");break}
  case"delq":S.questions=S.questions.filter(q=>q.id!==b.dataset.id);save();render();break;
  case"clearq":ask("Delete all questions?","Delete",()=>{S.questions=[];S.classes.forEach(k=>k.qi=0);save();render()});break;
  case"qpt":S.opt.qpt=!S.opt.qpt;save();render();break;
  case"clearbadges":ask(`Clear all badges for ${c.name}?`,"Clear",()=>{c.badges=[];save();render()});break;
  case"nav":page=b.dataset.p;try{history.replaceState(null,"","#"+page)}catch(x){}render();scrollTo(0,0);break;
  case"pt":bump(b.dataset.sid,+b.dataset.d);break;
  case"all":{const d=+b.dataset.d;c.students.forEach(s=>{s.pts+=d;s.grow=Math.max(0,s.grow+d)});save();d>0?sfx.up():sfx.down();render();toast(d>0?"Everyone +1":"Everyone -1");checkGarden();if(page==="class")document.querySelectorAll(".stu").forEach(el=>el.classList.add(d>0?"glowup":"shake"));break}
  case"tn":tn=clamp((tn||c.teams.length||4)+(+b.dataset.d),2,6);$("#tnum").textContent=tn;break;
  case"mkteams":{const n=tn||c.teams.length||4;const go=()=>{c.teams=makeTeamList(c,n,c.teams);save();sfx.pop();render();toast(n+" new teams")};if(c.teams.some(t=>t.pts))ask("Make new teams? Team points go back to 0.","Make teams",go);else go();break}
  case"move":{const i=c.teams.findIndex(t=>t.id===b.dataset.tid);if(i<0)break;c.teams[i].members=c.teams[i].members.filter(x=>x!==b.dataset.sid);c.teams[(i+1)%c.teams.length].members.push(b.dataset.sid);save();render();break}
  case"tpt":{const t=c.teams.find(t=>t.id===b.dataset.tid);if(!t)break;const d=+b.dataset.d;t.pts=Math.max(0,t.pts+d);save();d>0?sfx.up():sfx.down();if(d>0&&t.pts===S.opt.goal)setTimeout(sfx.chime,250);render();break}
  case"tool":tool=b.dataset.t;render();break;
  case"tset":T.total=T.left=+b.dataset.m*60;T.running=false;T.done=false;clearInterval(tInt);stopMusic();render();break;
  case"tadd":T.left+=60;T.total+=60;T.done=false;if(T.running)T.end+=60000;updTimer();break;
  case"tgo":ac();if(T.done){T.left=T.total;T.done=false}if(T.running){T.running=false;T.left=(T.end-Date.now())/1000;clearInterval(tInt);stopMusic()}else if(T.left>0){T.running=true;T.end=Date.now()+T.left*1000;clearInterval(tInt);tInt=setInterval(tickTimer,250);if(T.music)startMusic()}render();break;
  case"treset":T.running=false;T.done=false;T.left=T.total;clearInterval(tInt);stopMusic();render();break;
  case"tmusic":ac();T.music=!T.music;if(T.music&&T.running)startMusic();else stopMusic();render();break;
  case"nz":setNoise(+b.dataset.l);break;
  case"mic":ac();MIC.on?micStop():micStart(S.opt.micId||null);break;
  case"qreset":NZ.quiet=0;const q=$("#qtime");if(q)q.textContent=fmt(0);break;
  case"pick":doPick();break;
  case"norep":pick.noRepeat=!pick.noRepeat;render();break;
  case"pickreset":c.picked=[];save();render();toast("Everyone is back in the garden");break;
  case"buy":{const it=S.shop.find(x=>x.id===b.dataset.iid),s=stu(c,shopper);if(!it||!s)break;ask(`${s.name} buys "${it.name}" for ${it.cost} points?`,"Buy",()=>{s.pts-=it.cost;const d=new Date();c.log.unshift({who:s.name,item:it.name,cost:it.cost,when:d.toLocaleDateString(undefined,{month:"short",day:"numeric"})+" "+d.toLocaleTimeString(undefined,{hour:"2-digit",minute:"2-digit"})});c.log=c.log.slice(0,30);save();sfx.buy();render();toast(s.name+" bought "+it.name)});break}
  case"mYes":$("#modal").hidden=true;if(mFn){const f=mFn;mFn=null;f()}break;
  case"mNo":$("#modal").hidden=true;mFn=null;break;
  case"addcls":{const n=$("#newCls").value.trim()||"New class";const k={id:uid(),name:n,students:[],teams:[],picked:[],log:[]};S.classes.push(k);S.cur=k.id;save();render();toast("Class added");break}
  case"delcls":{const k=S.classes.find(x=>x.id===b.dataset.id);if(!k||S.classes.length<2)break;ask(`Delete ${k.name} and all its students?`,"Delete",()=>{S.classes=S.classes.filter(x=>x.id!==k.id);if(S.cur===k.id)S.cur=S.classes[0].id;save();render()});break}
  case"addstu":{const names=$("#newStu").value.split(/\n|,/).map(x=>x.trim()).filter(Boolean);if(!names.length){toast("Type a name first");break}names.forEach(n=>c.students.push({id:uid(),name:n,color:POT_COLORS[c.students.length%POT_COLORS.length],pts:0,grow:0}));save();render();toast(names.length+" added");break}
  case"delstu":{const s=stu(c,b.dataset.sid);if(!s)break;ask(`Delete ${s.name}?`,"Delete",()=>{c.students=c.students.filter(x=>x.id!==s.id);c.teams.forEach(t=>t.members=t.members.filter(x=>x!==s.id));c.picked=c.picked.filter(x=>x!==s.id);save();render()});break}
  case"scol":{const s=stu(c,b.dataset.sid);if(!s)break;s.color=POT_COLORS[(POT_COLORS.indexOf(s.color)+1)%POT_COLORS.length];save();b.style.background=s.color;break}
  case"tcol":{const t=c.teams.find(x=>x.id===b.dataset.tid);if(!t)break;t.color=TEAM_COLORS[(TEAM_COLORS.indexOf(t.color)+1)%TEAM_COLORS.length];save();b.style.background=t.color;break}
  case"additem":S.shop.push({id:uid(),name:"New reward",cost:10,icon:"gift"});save();render();break;
  case"delitem":{const it=S.shop.find(x=>x.id===b.dataset.id);if(!it)break;ask(`Delete "${it.name}"?`,"Delete",()=>{S.shop=S.shop.filter(x=>x.id!==it.id);save();render()});break}
  case"iicon":{const it=S.shop.find(x=>x.id===b.dataset.id);if(!it)break;it.icon=b.dataset.k;save();b.parentElement.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x===b));break}
  case"sound":S.opt.sound=!S.opt.sound;save();render();break;
  case"sky":S.opt.sky=S.opt.sky==="day"?"night":"day";save();updateWorld();chrome();break;
  case"resetpts":ask(`Set all points in ${c.name} back to 0? Plants go back to seeds.`,"Reset",()=>{c.students.forEach(s=>{s.pts=0;s.grow=0});c.teams.forEach(t=>t.pts=0);save();render();toast("Points reset")});break;
  case"copy":{const t=$("#backup");const done=()=>toast("Backup copied");try{navigator.clipboard.writeText(t.value).then(done,()=>{t.select();toast("Press Ctrl+C to copy")})}catch(x){t.select();toast("Press Ctrl+C to copy")}break}
  case"restore":{let o;try{o=JSON.parse($("#restore").value)}catch(x){toast("That backup text is not complete");break}if(!o||!Array.isArray(o.classes)){toast("That is not a Sprout Squad backup");break}ask("Replace everything with this backup?","Load",()=>{S=fix(o);save();render();toast("Backup loaded")});break}
  }
});

document.addEventListener("keydown",e=>{
  if(!$("#modal").hidden&&e.key==="Escape"){$("#modal").hidden=true;mFn=null;return}
  if(!$("#spanel").hidden&&e.key==="Escape"){$("#spanel").hidden=true;spOpen=null;return}
  if(!$("#mfpanel").hidden&&e.key==="Escape"){$("#mfpanel").hidden=true;return}
  if(e.key==="Enter"&&(document.activeElement?.classList.contains("rm")||document.activeElement?.classList.contains("mon"))){document.activeElement.click();return}
  if(page!=="garden"||/INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName||""))return;
  if(tool==="noise"&&["1","2","3"].includes(e.key))setNoise(+e.key-1);
  if(tool==="timer"&&e.code==="Space"){e.preventDefault();document.querySelector('[data-act="tgo"]')?.click()}

function setNoise(l){
  NZ.level=l;
  if(l===2)sfx.down();
  clearInterval(NZ.qInt);NZ.counting=l===0;
  if(l===0)NZ.qInt=setInterval(()=>{if(page!=="garden"||tool!=="noise")return;NZ.quiet++;const q=$("#qtime");if(q)q.textContent=fmt(NZ.quiet)},1000);
  else if(l===2)NZ.quiet=0;
  if(page==="garden"&&tool==="noise")render();
}
const MIC={ok:!(window.claude&&window.claude.use)&&!!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia),on:false,stream:null,an:null,buf:null,v:0,cand:0,since:0};
async function micStart(devId){
  micStop(true);
  const base={echoCancellation:false,noiseSuppression:false,autoGainControl:false};
  let st=null;
  try{st=await navigator.mediaDevices.getUserMedia({audio:devId?Object.assign({deviceId:{exact:devId}},base):base})}
  catch(e){try{st=await navigator.mediaDevices.getUserMedia({audio:devId?{deviceId:{exact:devId}}:true})}catch(e2){toast("Please allow the microphone in Chrome");render();return}}
  try{
    const a=ac();if(a.state!=="running"){try{await a.resume()}catch(x){}}
    const src=a.createMediaStreamSource(st);const an=a.createAnalyser();an.fftSize=2048;an.smoothingTimeConstant=0;src.connect(an);
    const sink=a.createGain();sink.gain.value=0;an.connect(sink);sink.connect(a.destination);
    window.__mic={st,src,an,sink};
    const tr=st.getAudioTracks()[0];
    MIC.stream=st;MIC.src=src;MIC.an=an;MIC.sink=sink;MIC.buf=new Float32Array(an.fftSize);MIC.on=true;MIC.v=0;MIC.peak=0;MIC.started=performance.now();MIC.label=tr?tr.label:"";
    if(tr)tr.onended=()=>{if(MIC.on){toast("The microphone stopped. Tap Let the beetle listen again.");micStop()}};
    try{const ds=await navigator.mediaDevices.enumerateDevices();MIC.devs=ds.filter(d=>d.kind==="audioinput"&&d.deviceId)}catch(x){MIC.devs=[]}
    MIC.dev=tr&&tr.getSettings?tr.getSettings().deviceId||devId:devId;
    setNoise(0);render();toast("The beetle is listening");requestAnimationFrame(micLoop);
  }catch(e){toast("The microphone could not start");micStop()}
}
function micStop(quiet){MIC.on=false;if(MIC.stream)MIC.stream.getTracks().forEach(t=>t.stop());try{MIC.src&&MIC.src.disconnect();MIC.sink&&MIC.sink.disconnect()}catch(x){}MIC.stream=null;MIC.src=null;window.__mic=null;if(!quiet)render()}
function micLoop(){
  if(!MIC.on)return;
  MIC.an.getFloatTimeDomainData(MIC.buf);let sum=0;for(let i=0;i<MIC.buf.length;i++)sum+=MIC.buf[i]*MIC.buf[i];
  const db=20*Math.log10(Math.sqrt(sum/MIC.buf.length)+1e-8);const vol=clamp((db+58)/38*100,0,100);
  MIC.v=vol>MIC.v?MIC.v*.6+vol*.4:MIC.v*.975+vol*.025;
  const vn=$("#vnum");if(vn)vn.textContent=Math.round(MIC.v);
  MIC.peak=Math.max(MIC.peak,vol);const hint=$("#michint");
  if(hint)hint.hidden=!(MIC.peak<3&&performance.now()-MIC.started>3000);
  const f=$("#vfill");if(f)f.style.clipPath=`inset(0 ${(100-MIC.v).toFixed(1)}% 0 0)`;
  const t2=S.opt.nzL,t1=t2-20,thr=[0,t1,t2],L=NZ.level,now=performance.now();
  // going up: stay above the next line for 0.4 s; going down: stay below this level's line (minus a little) for 1.5 s
  if(L<2&&MIC.v>=thr[L+1]){if(!MIC.upAt)MIC.upAt=now;if(now-MIC.upAt>=400){MIC.upAt=0;MIC.downAt=0;setNoise(MIC.v>=t2?2:L+1)}}else MIC.upAt=0;
  if(L>0&&MIC.v<thr[L]-5){if(!MIC.downAt)MIC.downAt=now;if(now-MIC.downAt>=1500){MIC.downAt=0;setNoise(MIC.v<t1-5?0:1)}}else MIC.downAt=0;
  requestAnimationFrame(micLoop);
}
function doPick(){
  const c=cls();if(pick.spinning||!c.students.length)return;
  let pool=c.students.filter(s=>!isDizzy(s,c)&&(!pick.noRepeat||!c.picked.includes(s.id)));
  if(!pool.length){c.picked=[];pool=c.students.filter(s=>!isDizzy(s,c));if(!pool.length){toast("Everyone is dizzy!");return}toast("Everyone had a turn. Starting again!")}
  const win=pool[Math.floor(Math.random()*pool.length)];
  pick.spinning=true;render();let n=0;const steps=16;
  const spin=()=>{const r=c.students[Math.floor(Math.random()*c.students.length)];const el=$("#pname");if(el){el.textContent=r.name;el.style.opacity=".7"}sfx.tick();n++;
    if(n<steps)setTimeout(spin,50+n*n*1.6);else{pick.spinning=false;pick.id=win.id;if(pick.noRepeat&&!c.picked.includes(win.id))c.picked.push(win.id);save();render();const pb=$("#pickbox");if(pb)pb.classList.add("pop");sfx.pop()}};
  spin();
}
